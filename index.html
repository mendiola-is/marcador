<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Puntos - Equipos</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: #f4f6f9; text-align: center; color: #333; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #2c3e50; }
        .card { background: white; padding: 20px; margin: 12px 0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #3498db; }
        .info { text-align: left; }
        .info h2 { margin: 0; font-size: 22px; color: #2c3e50; }
        .info span { font-size: 16px; color: #7f8c8d; }
        .botones { display: flex; gap: 10px; }
        button { border: none; padding: 12px 20px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-restar { background: #e74c3c; color: white; }
        .btn-sumar { background: #2ecc71; color: white; }
    </style>
</head>
<body>

    <h1>📱 Panel de Control de Puntos</h1>
    <div id="lista-equipos"></div>

    <script>
        // Configuración de Firebase (Reemplaza con tu URL)
        const firebaseConfig = {
            databaseURL: "https://firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Tus 4 equipos establecidos con puntaje inicial en 0
        const equiposIniciales = [
            { id: "eq1", nombre: "Horses", puntos: 0 },
            { id: "eq2", nombre: "Seagulls", puntos: 0 },
            { id: "eq3", nombre: "Dolphins", puntos: 0 },
            { id: "eq4", nombre: "Eagles", puntos: 0 }
        ];

        // Sincronizar y mostrar equipos en el celular
        db.ref('marcador_equipos').on('value', (snapshot) => {
            const data = snapshot.val();
            const contenedor = document.getElementById('lista-equipos');
            contenedor.innerHTML = "";

            // Si la base de datos está limpia, inyecta tus 4 equipos
            if (!data) {
                equiposIniciales.forEach(eq => db.ref('marcador_equipos/' + eq.id).set(eq));
                return;
            }

            Object.keys(data).forEach(id => {
                const eq = data[id];
                contenedor.innerHTML += `
                    <div class="card">
                        <div class="info">
                            <h2>${eq.nombre}</h2>
                            <span>${eq.puntos} puntos</span>
                        </div>
                        <div class="botones">
                            <button class="btn-restar" onclick="modificarPuntos('${eq.id}', -1)">-1</button>
                            <button class="btn-sumar" onclick="modificarPuntos('${eq.id}', 1)">+1</button>
                        </div>
                    </div>
                `;
            });
        });

        // Función matemática directa para actualizar los puntos
        function modificarPuntos(id, cambio) {
            const ref = db.ref('marcador_equipos/' + id + '/puntos');
            ref.transaction((puntosActuales) => (puntosActuales || 0) + cambio);
        }
    </script>
</body>
</html>
