<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificación en Tiempo Real</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { font-family: 'Segoe UI', Helvetica, sans-serif; background: #0b0c10; color: #ffffff; text-align: center; margin: 0; padding: 50px 20px; }
        h1 { font-size: 55px; color: #66fcf1; text-shadow: 0 0 15px rgba(102,252,241,0.6); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 20px; color: #c5c6c7; margin-bottom: 40px; }
        .tabla { max-width: 850px; margin: 0 auto; background: #1f2833; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .fila { display: flex; justify-content: space-between; align-items: center; padding: 22px 30px; margin: 15px 0; background: #151a21; border-radius: 12px; font-size: 32px; font-weight: 600; border-left: 8px solid #45f3ff; transition: all 0.4s ease-in-out; }
        
        /* Estilos VIP para el podio (Top 3) */
        .fila:nth-child(1) { background: linear-gradient(90deg, #f1c40f, #1f2833); color: #000; border-left: 8px solid #f39c12; }
        .fila:nth-child(2) { background: linear-gradient(90deg, #bdc3c7, #1f2833); color: #000; border-left: 8px solid #7f8c8d; }
        .fila:nth-child(3) { background: linear-gradient(90deg, #e67e22, #1f2833); color: #000; border-left: 8px solid #d35400; }
        
        .puesto { width: 70px; text-align: left; font-size: 36px; }
        .nombre { flex-grow: 1; text-align: left; margin-left: 10px; }
        .puntos { font-size: 36px; color: #66fcf1; font-weight: bold; }
        .fila:nth-child(-n+3) .puntos { color: #000; } /* Letras oscuras en los fondos brillantes del podio */
    </style>
</head>
<body>

    <h1>🏆 Marcador en Tiempo Real 🏆</h1>
    <p>Clasificación automática por puntos numéricos</p>

    <div class="tabla" id="tabla-posiciones">
        <!-- Posiciones dinámicas -->
    </div>

    <script>
        // Configuración de Firebase (Usa la misma que en el celular)
        const firebaseConfig = {
            databaseURL: "https://firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Monitorear cambios numéricos y reordenar puestos
        db.ref('marcador_equipos').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Pasar los datos mapeados a una lista ordenada
            const listaEquipos = Object.keys(data).map(id => data[id]);
            
            // Ordenar numéricamente de Mayor a Menor puntos
            listaEquipos.sort((a, b) => b.puntos - a.puntos);

            const tabla = document.getElementById('tabla-posiciones');
            tabla.innerHTML = "";

            // Renderizar los puestos actualizados
            listaEquipos.forEach((equipo, indice) => {
                tabla.innerHTML += `
                    <div class="fila">
                        <span class="puesto">#${indice + 1}</span>
                        <span class="nombre">${equipo.nombre}</span>
                        <span class="puntos">${equipo.puntos} Pts</span>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
